name: CourseForge tests
on:
  push:
  pull_request:
jobs:
  unit-and-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media prerequisites
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app scripts
      - name: Validate browser script syntax
        run: node --check app/static/app.js && node --check app/static/services.js && node --check app/static/learning-paths.js && node --check app/static/assessments.js && node --check app/static/practice.js && node --check app/static/planner.js && node --check app/static/weekly.js
      - run: pytest -q
