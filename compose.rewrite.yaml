name: courseforge-rewrite
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: courseforge_rewrite
      POSTGRES_USER: courseforge
      POSTGRES_PASSWORD: local_rewrite_only
    ports:
      - "127.0.0.1:${CF_REWRITE_DB_PORT:-15439}:5432"
    volumes:
      - rewrite_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courseforge -d courseforge_rewrite"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  api:
    build:
      context: ./backend
    environment:
      CF_DATABASE_URL: postgresql://courseforge:local_rewrite_only@postgres:5432/courseforge_rewrite?sslmode=disable
      CF_HTTP_ADDR: ":8090"
      CF_PUBLIC_ORIGIN: "${CF_REWRITE_PUBLIC_ORIGIN:-http://127.0.0.1:18096}"
      CF_COOKIE_SECURE: "false"
      CF_REGISTRATION_OPEN: "true"
      CF_MIGRATE: "true"
      CF_DEV_MODE: "true"
      CF_MEDIA_MODE: "external"
    ports:
      - "127.0.0.1:${CF_REWRITE_API_PORT:-18090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [app]
  media:
    build:
      context: ./backend
    entrypoint: [media]
    environment:
      CF_DATABASE_URL: postgresql://courseforge:local_rewrite_only@postgres:5432/courseforge_rewrite?sslmode=disable
      CF_HTTP_ADDR: ":8091"
      CF_PUBLIC_ORIGIN: "${CF_REWRITE_PUBLIC_ORIGIN:-http://127.0.0.1:18096}"
      CF_COOKIE_SECURE: "false"
      CF_DB_MAX_CONNS: "8"
      CF_MIGRATE: "false"
      CF_DEV_MODE: "true"
      CF_MEDIA_SIMULATOR_URL: "${CF_REWRITE_MEDIA_SIMULATOR_URL:-}"
      ODYSEE_AUTH_TOKEN: "${ODYSEE_AUTH_TOKEN:-}"
      ODYSEE_CHANNEL_ID: "${ODYSEE_CHANNEL_ID:-}"
      ODYSEE_AUTH_TOKEN_2: "${ODYSEE_AUTH_TOKEN_2:-}"
      ODYSEE_CHANNEL_ID_2: "${ODYSEE_CHANNEL_ID_2:-}"
      ODYSEE_AUTH_TOKEN_3: "${ODYSEE_AUTH_TOKEN_3:-}"
      ODYSEE_CHANNEL_ID_3: "${ODYSEE_CHANNEL_ID_3:-}"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [app]
  web:
    build:
      context: ./web
    environment:
      COURSEFORGE_API_UPSTREAM: "api:8090"
      COURSEFORGE_MEDIA_UPSTREAM: "media:8091"
    ports:
      - "127.0.0.1:${CF_REWRITE_WEB_PORT:-18096}:8080"
    depends_on:
      - api
      - media
    profiles: [app]
volumes:
  rewrite_pg:
