upstream courseforge_api_cluster {
    server 127.0.0.1:18090 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:18091 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    # TLS terminates here on 8000 (Let's Encrypt cert mounted at /etc/nginx/ssl).
    listen 8000 ssl default_server;
    server_name courseforge.duckdns.org localhost 127.0.0.1 141.148.195.233;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64M;

    ssl_certificate /etc/nginx/ssl/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/courseforge.duckdns.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Plain-HTTP requests to the TLS port get redirected instead of a 400.
    error_page 497 =301 https://$http_host$request_uri;

    # Edge TLS should enable HTTP/2; see docs/MEDIA_DELIVERY.md.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/vnd.apple.mpegurl application/x-mpegURL image/svg+xml font/woff2;
    # Brotli only if ngx_brotli is available.

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control "no-cache" always;

    keepalive_timeout 120s;
    keepalive_requests 10000;

    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location = /api/health {
        access_log off;
        proxy_pass http://courseforge_api_cluster/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # The media URL includes a short-lived gateway authorization token. Keep
    # private API/media paths out of access logs and every shared cache.
    location ~ ^/api/v1/playback/sessions/[^/]+/media$ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:18094;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_cache off;
    }

    location ~ ^/api/v1/playback/sessions/[^/]+/hls/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:18094;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_set_header Range $http_range;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_cache off;
    }

    location /media/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:18094;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_cache off;
    }

    location /api/ {
        access_log off;
        proxy_pass http://courseforge_api_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_cache off;
    }

    location /verify/ {
        access_log off;
        proxy_pass http://courseforge_api_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_cache off;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
