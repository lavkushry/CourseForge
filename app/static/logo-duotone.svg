<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#04060A"/>
    </linearGradient>

    <!-- Electric Cyan-Blue to Royal Meta Blue Gradient -->
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="50%" stop-color="#0072FF"/>
      <stop offset="100%" stop-color="#0051FF"/>
    </linearGradient>

    <!-- Soft Glow -->
    <filter id="azureGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="260" rx="20" fill="url(#bgGrad2)"/>
  <rect width="956" height="256" x="2" y="2" rx="18" fill="none" stroke="#1E293B" stroke-width="1.5" opacity="0.4"/>

  <!-- PURE FULL-TEXT DUOTONE (Centered) -->
  <g transform="translate(480, 155)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif" 
          font-size="108" 
          font-weight="800" 
          letter-spacing="-3.5">
      <tspan fill="url(#azureGrad)" filter="url(#azureGlow)">course</tspan><tspan fill="#F8FAFC">forge</tspan><tspan fill="#00C6FF">.</tspan>
    </text>
  </g>

  <text x="480" y="202" 
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'SF Pro Text', 'Inter', sans-serif" 
        font-size="12" 
        font-weight="700" 
        letter-spacing="6" 
        fill="#64748B">
    FULL-TEXT DUOTONE WORDMARK
  </text>
</svg>
